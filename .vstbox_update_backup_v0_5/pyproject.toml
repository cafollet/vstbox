[project]
name = "vstbox-pre-hardware"
version = "0.4.0"
description = "Pre-hardware feasibility and real-plugin benchmark tooling for a Raspberry Pi 5 based standalone VST appliance"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vstbox-sim = "vstbox_sim.cli:main"
vstbox-machine = "vstbox_bench.cli_machine:main"
vstbox-bench-synthetic = "vstbox_bench.cli_synthetic:main"
vstbox-bench-vst3 = "vstbox_bench.cli_vst3:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vstbox_sim", "vstbox_bench"]

[tool.pytest.ini_options]
pythonpath = ["."]
