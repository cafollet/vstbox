[project]
name = "vstbox-pre-hardware"
version = "0.1.0"
description = "Pre-hardware feasibility simulator for a Raspberry Pi 5 based standalone VST appliance"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vstbox-sim = "vstbox_sim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
